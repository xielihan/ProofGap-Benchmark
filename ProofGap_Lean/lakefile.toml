name = "proof_gap_benchmark"
version = "0.1.0"
defaultTargets = ["ProofGapLean"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0-rc6"

[[lean_lib]]
name = "ProofGapLean"
srcDir = "."
roots = ["ProofGap_lean_llm"]
globs = ["ProofGap_lean_llm.+"]

[[lean_lib]]
name = "ProofGapLeanBackend"
srcDir = "."
roots = ["ProofGap_lean"]
globs = ["ProofGap_lean.+"]
